name: Build and Release CV

on:
  push:
    branches: [main]

permissions:
  contents: write

# A newer push supersedes a running build: the release only ever needs the tip.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Get commit date and store in env
        run: |
          echo "COMMIT_DATE=$(git show -s --format=%cs ${{ github.sha }})" >> "$GITHUB_ENV"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build CV
        run: |
          nix develop --command just compile

      - name: Rename PDF
        run: |
          mv cv.pdf Stefan-Lendl-CV.pdf

      - name: Publish release for the commit date
        # One release per day, many tags per day. Each build is tagged
        # <date>-<short sha>; a tag names one commit and is never moved. The
        # new release is created first, then the day's earlier release is
        # deleted together with its tag.
        run: |
          tag="$COMMIT_DATE-${GITHUB_SHA::7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Stefan-Lendl-CV.pdf --clobber
          else
            gh release create "$tag" Stefan-Lendl-CV.pdf --target "$GITHUB_SHA" \
              --title "CV $COMMIT_DATE" --notes "Built from $GITHUB_SHA" --latest
          fi
          gh release list --limit 100 --json tagName --jq '.[].tagName' |
            grep -E "^$COMMIT_DATE(-|$)" | grep -vxF "$tag" |
            while read -r old; do
              echo "Replacing release: $old"
              gh release delete "$old" --yes --cleanup-tag
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old releases
        run: |
          gh release list --limit 100 --json tagName --jq ".[${keep}:][].tagName" |
          while read -r tag; do
            echo "Deleting release: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          keep: 5
