name: Build and Release CV

on:
  push:
    branches: [main]

permissions:
  contents: write

# A newer push supersedes a running build: the release only ever needs the tip.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Get commit date and store in env
        run: |
          echo "COMMIT_DATE=$(git show -s --format=%cs ${{ github.sha }})" >> "$GITHUB_ENV"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build CV
        run: |
          nix develop --command just compile

      - name: Rename PDF
        run: |
          mv cv.pdf Stefan-Lendl-CV.pdf

      - name: Publish release for the commit date
        # One release per day, updated in place: the tag is force-moved to this
        # commit and the PDF is replaced, so the release keeps its ID and URL.
        run: |
          git tag -f "$COMMIT_DATE"
          git push -f origin "refs/tags/$COMMIT_DATE"
          if gh release view "$COMMIT_DATE" >/dev/null 2>&1; then
            gh release upload "$COMMIT_DATE" Stefan-Lendl-CV.pdf --clobber
            gh release edit "$COMMIT_DATE" --latest
          else
            gh release create "$COMMIT_DATE" Stefan-Lendl-CV.pdf \
              --title "CV $COMMIT_DATE" --notes "Built from ${{ github.sha }}" --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old releases
        run: |
          gh release list --limit 100 --json tagName --jq ".[${keep}:][].tagName" |
          while read -r tag; do
            echo "Deleting release: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          keep: 5
