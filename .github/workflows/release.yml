name: Build and Release CV

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Get commit date and store in env
        run: |
          echo "COMMIT_DATE=$(git show -s --format=%cs ${{ github.sha }})" >> $GITHUB_ENV

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build CV
        run: |
          nix develop --command just compile

      - name: Rename PDF
        run: |
          mv cv.pdf ${COMMIT_DATE}-Stefan-Lendl-CV.pdf

      - name: Delete existing release if same date
        run: |
          # Delete release and tag if they exist (will fail silently if they don't)
          gh release delete "$COMMIT_DATE" --yes 2>/dev/null || true
          git push origin --delete "$COMMIT_DATE" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.COMMIT_DATE }}
          name: CV ${{ env.COMMIT_DATE }}
          files: ${{ env.COMMIT_DATE }}-Stefan-Lendl-CV.pdf
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old releases
        run: |
          # List all releases, skip the ${keep} most recent, delete the rest
          gh release list --limit 100 --json tagName --jq ".[${keep}:][].tagName" | \
          while read tag; do
            if [ -n "$tag" ]; then
              echo "Deleting release: $tag"
              gh release delete "$tag" --yes
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          keep: 5
